name: Promote dev images

on:
  workflow_dispatch:
    inputs:
      playwright_version:
        description: "Playwright GA version to promote (e.g. 1.63.0)"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate Playwright version
        id: version
        shell: bash -euo pipefail {0}
        env:
          REQUESTED_VERSION: ${{ inputs.playwright_version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Playwright version must match X.Y.Z (e.g. 1.63.0)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker-container

      - name: Forgejo login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: forgejo.treyturner.info
          username: ${{ github.repository_owner }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: GitHub Container Registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Promote all dev images
        shell: bash -euo pipefail {0}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          PLAYWRIGHT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          owner_lower="$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')"
          registries=(
            "forgejo.treyturner.info/${owner_lower}"
            "ghcr.io/${owner_lower}"
          )
          source_tag() {
            case "$1" in
              codercom-base) printf '%s\n' ubuntu-dev ;;
              codercom-playwright) printf 'ubuntu-%s-dev\n' "$PLAYWRIGHT_VERSION" ;;
              codercom-webdev) printf 'ubuntu-%s-dev\n' "$PLAYWRIGHT_VERSION" ;;
            esac
          }

          target_tag() {
            case "$1" in
              codercom-base) printf '%s\n' ubuntu ;;
              codercom-playwright) printf 'ubuntu-%s\n' "$PLAYWRIGHT_VERSION" ;;
              codercom-webdev) printf 'ubuntu-%s\n' "$PLAYWRIGHT_VERSION" ;;
            esac
          }

          images=(codercom-base codercom-playwright codercom-webdev)

          for registry in "${registries[@]}"; do
            for image in "${images[@]}"; do
              source="${registry}/${image}:$(source_tag "$image")"
              echo "Validating ${source}"
              docker buildx imagetools inspect "$source" > /dev/null
            done
          done

          for registry in "${registries[@]}"; do
            for image in "${images[@]}"; do
              source="${registry}/${image}:$(source_tag "$image")"
              target="${registry}/${image}:$(target_tag "$image")"
              echo "Promoting ${source} to ${target}"
              docker buildx imagetools create --tag "$target" "$source"
            done
          done
