name: Build and test PR

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - Dockerfile.base
      - Dockerfile.playwright
      - '.github/workflows/**'

env:
  UPSTREAM_REF: "ubuntu"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.changes.outputs.base }}
      playwright: ${{ steps.changes.outputs.playwright }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=false
          playwright=false

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            base=true
            playwright=true
          else
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              Dockerfile.base .github/workflows/; then
              base=true
              playwright=true
            fi
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              Dockerfile.playwright .github/workflows/; then
              playwright=true
            fi
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "playwright=$playwright" >> "$GITHUB_OUTPUT"

  resolve-playwright-version:
    needs: detect-changes
    if: needs.detect-changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve latest Playwright version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release="$(
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/microsoft/playwright/releases/latest
          )"
          version="$(jq -er '.tag_name | ltrimstr("v")' <<< "$release")"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Playwright GA version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Playwright $version" >> "$GITHUB_STEP_SUMMARY"

  build-pr:
    needs:
      - detect-changes
      - resolve-playwright-version
    if: needs.detect-changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build proposed base
        if: needs.detect-changes.outputs.base == 'true'
        uses: ./.github/actions/build
        with:
          dockerfile: Dockerfile.base
          label: ${{ format('pr{0}', github.event.pull_request.number) }}
          repos: ghcr.io/treyturner/codercom-base
          upstream-ref: ${{ env.UPSTREAM_REF }}

      - name: Build Playwright
        uses: ./.github/actions/build
        with:
          dockerfile: Dockerfile.playwright
          build-args: |
            PLAYWRIGHT_VERSION=${{ needs.resolve-playwright-version.outputs.version }}
            BASE_TAG=${{ needs.detect-changes.outputs.base == 'true' && format('ubuntu-pr{0}', github.event.pull_request.number) || 'ubuntu' }}
          label: ${{ format('{0}-pr{1}', needs.resolve-playwright-version.outputs.version, github.event.pull_request.number) }}
          upstream-ref: ${{ env.UPSTREAM_REF }}
