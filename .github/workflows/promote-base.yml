name: Promote base dev tag

on:
  workflow_dispatch:

jobs:
  promote-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      #DOCKERHUB_OWNER: treyturner
      IMAGE_NAME: codercom-base
      SOURCE_TAG: ubuntu-dev
      TARGET_TAG: ubuntu

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker-container

      # - name: DockerHub login
      #   uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      #   with:
      #     username: ${{ vars.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Forgejo login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: forgejo.treyturner.info
          username: ${{ github.repository_owner }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: GitHub Container Registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Promote ubuntu-dev to ubuntu
        shell: bash -euo pipefail {0}
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower="$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')"
          repositories=(
            # "${DOCKERHUB_OWNER}/${IMAGE_NAME}"
            "forgejo.treyturner.info/${owner_lower}/${IMAGE_NAME}"
            "ghcr.io/${owner_lower}/${IMAGE_NAME}"
          )

          for repository in "${repositories[@]}"; do
            echo "Validating ${repository}:${SOURCE_TAG}"
            docker buildx imagetools inspect \
              "${repository}:${SOURCE_TAG}" > /dev/null
          done

          for repository in "${repositories[@]}"; do
            echo "Promoting ${repository}:${SOURCE_TAG} to ${TARGET_TAG}"
            docker buildx imagetools create \
              --tag "${repository}:${TARGET_TAG}" \
              "${repository}:${SOURCE_TAG}"
          done
