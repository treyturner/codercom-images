[unix_http_server]
file=/tmp/chatgpt-desktop/supervisor.sock
chmod=0700

[supervisord]
nodaemon=false
umask=077
pidfile=/tmp/chatgpt-desktop/supervisord.pid
logfile=/home/coder/.local/state/chatgpt-desktop/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
childlogdir=/home/coder/.local/state/chatgpt-desktop

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/chatgpt-desktop/supervisor.sock

[program:chatgpt-desktop]
command=/usr/local/bin/run-chatgpt-xpra
directory=/home/coder
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/coder/.local/state/chatgpt-desktop/xpra.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
